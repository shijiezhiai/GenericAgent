<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Hub · Conductor</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: rgba(255,255,255,0.78);
      --panel-2: rgba(255,255,255,0.92);
      --border: rgba(31,42,68,0.10);
      --text: #172033;
      --muted: #7a8497;
      --soft: #43506a;
      --accent: #3b82f6;
      --accent-2: #8b5cf6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --gray: #9ca3af;
      --shadow: 0 18px 55px rgba(30, 45, 80, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 12% 8%, rgba(59, 130, 246, .14), transparent 54%),
        radial-gradient(800px 650px at 86% 18%, rgba(139, 92, 246, .12), transparent 58%),
        radial-gradient(650px 520px at 61% 94%, rgba(16, 185, 129, .10), transparent 60%),
        linear-gradient(180deg, #fbfcff, var(--bg));
    }

    /* ===== 顶部导航栏 ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 16px 32px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar .back-btn {
      display: flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); background: rgba(255,255,255,.6);
      padding: 7px 14px; border-radius: 10px; font-size: 13px; cursor: pointer;
      color: var(--soft); transition: all .15s; white-space: nowrap;
    }
    .topbar .back-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .topbar .back-btn svg { width: 16px; height: 16px; }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo { width: 36px; height: 36px; flex-shrink: 0; }
    .brand .brand-text h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .brand .brand-text p { margin: 0; font-size: 12px; color: var(--muted); }

    .topbar .spacer { flex: 1; }
    .topbar .skill-count {
      font-size: 13px; color: var(--muted); padding: 5px 14px;
      background: rgba(59,130,246,.08); border-radius: 99px; white-space: nowrap;
    }
    .topbar .skill-count b { color: var(--accent); }

    /* ===== 主内容区 ===== */
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 32px 60px; }
    .container[hidden] { display: none !important; }

    /* Tab 切换 */
    .tabbar { display: flex; gap: 4px; max-width: 1100px; margin: 0 auto; padding: 16px 32px 0; border-bottom: 1px solid var(--border, #2a2a3a); }
    .tab-btn { padding: 10px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted, #8a8a9a); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .tab-btn:hover { color: var(--fg, #e4e4e8); }
    .tab-btn.active { color: var(--accent, #3b82f6); border-bottom-color: var(--accent, #3b82f6); }

    /* Plugin 区块 */
    .plugin-section { margin-bottom: 32px; }
    .plugin-section .ps-head { margin-bottom: 14px; }
    .plugin-section .ps-head h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .plugin-section .ps-sub { font-size: 12px; color: var(--muted, #8a8a9a); }
    .pd-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .pd-add-row input { flex: 1; padding: 9px 12px; background: var(--card, #1e1e2a); border: 1px solid var(--border, #2a2a3a); border-radius: 8px; color: var(--fg, #e4e4e8); font-size: 13px; }
    .pd-add-row input:focus { outline: none; border-color: var(--accent, #3b82f6); }
    .pd-add-row button { padding: 9px 18px; background: var(--accent, #3b82f6); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .pd-add-row button:hover { filter: brightness(1.1); }

    .ext-repo-list { display: flex; flex-direction: column; gap: 12px; }
    .plg-dir-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card, #1e1e2a); border: 1px solid var(--border, #2a2a3a); border-radius: 10px; }
    .plg-dir-item .pd-path { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
    .plg-dir-remove { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; flex-shrink: 0; margin-left: 12px; }
    .plg-dir-remove:hover { background: #ef4444; color: #fff; }
    .plg-empty { padding: 20px; text-align: center; color: var(--muted, #8a8a9a); font-size: 13px; background: var(--card, #1e1e2a); border: 1px dashed var(--border, #2a2a3a); border-radius: 10px; }

    .plg-card { background: var(--card, #1e1e2a); border: 1px solid var(--border, #2a2a3a); border-radius: 10px; padding: 14px 16px; }
    .plg-card .plg-name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .plg-card .plg-ver { font-size: 11px; color: var(--muted, #8a8a9a); font-weight: 400; }
    .plg-card .plg-desc { font-size: 13px; color: var(--muted, #8a8a9a); margin: 6px 0 8px; }
    .plg-card .plg-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .plg-card .plg-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(59,130,246,.15); color: var(--accent, #3b82f6); }
    .plg-card .plg-tag.dim { background: rgba(138,138,154,.15); color: var(--muted, #8a8a9a); }
    .plg-builtin .plg-name .plg-mod { font-size: 11px; color: var(--muted, #8a8a9a); font-family: ui-monospace, monospace; font-weight: 400; }
    .plg-empty.error { color: #ef4444; border-color: rgba(239,68,68,.4); }
    .plg-desc.error { color: #ef4444; margin-top: 6px; }
    .plg-meta { font-size: 12px; color: var(--muted, #8a8a9a); margin-top: 6px; font-family: ui-monospace, monospace; }
    .plg-builtin .plg-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .plg-builtin .plg-status.on { background: rgba(34,197,94,.15); color: #22c55e; }
    .plg-builtin .plg-status.off { background: rgba(239,68,68,.15); color: #ef4444; }

    /* 安装区 */
    .install-bar {
      display: flex; gap: 10px; align-items: center;
      padding: 16px 20px; margin-bottom: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      border: 1px solid var(--border); border-radius: 18px;
      backdrop-filter: blur(18px); box-shadow: var(--shadow);
    }
    .install-bar .ib-label { font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .install-bar input {
      flex: 1; border: 1px solid rgba(31,42,68,.15); border-radius: 10px;
      padding: 9px 14px; font-size: 13px; background: rgba(255,255,255,.7); font-family: inherit;
    }
    .install-bar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .install-bar input[name="skillName"] { flex: 0 0 140px; }
    .install-bar button {
      border: none; background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff; padding: 9px 22px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all .15s;
      box-shadow: 0 4px 14px rgba(59,130,246,.3);
    }
    .install-bar button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,.4); }
    .install-bar button:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* 搜索栏 */
    .search-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
      padding: 0 4px;
    }
    .search-bar .search-input-wrap { flex: 1; position: relative; }
    .search-bar .search-input-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
    .search-bar input {
      width: 100%; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px 10px 42px; font-size: 14px; background: rgba(255,255,255,.7);
      backdrop-filter: blur(12px); font-family: inherit;
    }
    .search-bar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }

    /* ===== Skill 卡片网格 ===== */
    .skill-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .cat-section { margin-bottom: 28px; }
    .cat-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 0 2px;
    }
    .cat-header .cat-title { font-size: 16px; font-weight: 700; color: var(--text, #1f2a44); }
    .cat-header .cat-count {
      font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(31,42,68,.06);
      padding: 2px 10px; border-radius: 20px;
    }
    .cat-header .cat-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(31,42,68,.12), transparent); }
    .skill-card {
      padding: 20px; border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.68));
      border: 1px solid var(--border); backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .skill-card:hover { transform: translateY(-3px); box-shadow: 0 24px 60px rgba(30,45,80,.16); }
    .skill-card .sc-top { display: flex; align-items: flex-start; gap: 12px; }
    .skill-card .sc-icon {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(59,130,246,.12), rgba(139,92,246,.1));
    }
    .skill-card .sc-icon svg { width: 22px; height: 22px; }
    .skill-card .sc-info { flex: 1; min-width: 0; }
    .skill-card .sc-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .skill-card .sc-desc { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .skill-card .sc-meta { font-size: 11px; color: var(--muted); font-family: monospace; opacity: .7; word-break: break-all; }
    .skill-card .sc-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px solid rgba(31,42,68,.06); }
    .sc-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(16,185,129,.1); color: var(--green); font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
    .sc-badge.has-script { background: rgba(245,158,11,.1); color: var(--amber); }
    .sc-uninstall {
      margin-left: auto; border: 1px solid var(--red); color: var(--red); background: transparent;
      padding: 5px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .sc-uninstall:hover { background: var(--red); color: #fff; }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-state svg { width: 64px; height: 64px; opacity: .3; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin: 0; }
    .empty-state .hint { font-size: 12px; margin-top: 8px; opacity: .7; }

    .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }

    /* ===== Toast ===== */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: rgba(31,42,68,.92); color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; z-index: 9999; opacity: 0; transition: all .3s; box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Confirm Modal ===== */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(31,42,68,.45); z-index: 10000;
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .confirm-overlay.show { display: flex; opacity: 1; }
    .confirm-box {
      background: var(--panel-2); backdrop-filter: blur(20px); border-radius: 18px;
      padding: 28px 32px; max-width: 400px; box-shadow: 0 20px 60px rgba(31,42,68,.3);
      text-align: center;
    }
    .confirm-box p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; }
    .confirm-box .cf-btns { display: flex; gap: 10px; justify-content: center; }
    .confirm-box .cf-btns button { padding: 9px 24px; border-radius: 10px; font-size: 13px; cursor: pointer; border: none; font-weight: 600; }
    .confirm-box .cf-yes { background: var(--red); color: #fff; }
    .confirm-box .cf-no { background: rgba(31,42,68,.1); color: var(--text); }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回 Conductor
    </button>
    <div class="brand">
      <!-- Skill Hub 图标 -->
      <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sh-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <!-- 四块拼图积木，代表 skill 模块化组合 -->
        <rect x="4" y="4" width="18" height="18" rx="5" fill="url(#sh-grad)" opacity="0.92"/>
        <rect x="26" y="4" width="18" height="18" rx="5" fill="url(#sh-grad)" opacity="0.68"/>
        <rect x="4" y="26" width="18" height="18" rx="5" fill="url(#sh-grad)" opacity="0.68"/>
        <rect x="26" y="26" width="18" height="18" rx="5" fill="url(#sh-grad)" opacity="0.92"/>
        <!-- 中心连接点 -->
        <circle cx="24" cy="24" r="4.5" fill="#fff"/>
        <circle cx="24" cy="24" r="2.5" fill="url(#sh-grad)"/>
      </svg>
      <div class="brand-text">
        <h1>Skill Hub</h1>
        <p>安装 · 管理 · 卸载 Agent Skills</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="skill-count">已安装 <b id="countNum">0</b> 个 Skill</div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabSkills" onclick="switchTab('skills')">Skills</button>
    <button class="tab-btn" id="tabPlugins" onclick="switchTab('plugins')">Plugins</button>
  </div>

  <!-- Skills 内容 -->
  <div class="container" id="skillsPane">
    <!-- 安装区 -->
    <div class="install-bar">
      <div class="ib-label">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        安装新 Skill
      </div>
      <input type="text" id="skillGitUrl" placeholder="Git 仓库 URL (https://github.com/owner/repo)" />
      <input type="text" id="skillName" name="skillName" placeholder="skill 名称" />
      <button id="skillInstallBtn">安装</button>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索已安装的 Skill…" />
      </div>
    </div>

    <!-- Skill 卡片网格 -->
    <div class="skill-grid" id="skillGrid">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- Plugins 内容 -->
  <div class="container" id="pluginsPane" hidden>
    <div class="plugin-section">
      <div class="ps-head">
        <h3>外部 Plugin 仓库</h3>
        <span class="ps-sub">管理 Claude 风格的 plugin 仓库目录（写入 skills_config.json）</span>
      </div>
      <div class="pd-add-row">
        <input type="text" id="pluginDirInput" placeholder="输入 plugin 仓库的绝对路径，如 /path/to/plugin-repo" />
        <button id="pluginDirAddBtn" onclick="addPluginDir()">添加目录</button>
      </div>
      <div id="extRepoList" class="ext-repo-list"><div class="loading">加载中…</div></div>
    </div>
    <div class="plugin-section">
      <div class="ps-head">
        <h3>已发现的 Plugin</h3>
        <span class="ps-sub">从配置的仓库目录中发现的外部 plugin（名称/描述/版本/包含的 skills 等）</span>
      </div>
      <div id="extPluginList" class="ext-repo-list"><div class="loading">加载中…</div></div>
    </div>
    <div class="plugin-section">
      <div class="ps-head">
        <h3>内置 Plugins</h3>
        <span class="ps-sub">GA 根目录 plugins/*.py，随会话自动加载（只读，禁用需改名加下划线前缀）</span>
      </div>
      <div id="builtinPluginList" class="ext-repo-list"><div class="loading">加载中…</div></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Confirm Modal -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p id="confirmText"></p>
      <div class="cf-btns">
        <button class="cf-no" id="confirmCancel">取消</button>
        <button class="cf-yes" id="confirmOk">确认卸载</button>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('skillGrid');
    let allSkills = [];
    let catOrderList = [];
    const countNum = document.getElementById('countNum');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmText = document.getElementById('confirmText');
    let toastTimer = null;
    let pendingUninstall = null;

    function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // 卡片图标 SVG（小型拼图块）
    function cardIcon(){
      return `<svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="ci-${Math.random().toString(36).slice(2,7)}" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>`;
    }
    function skillIconSvg(){
      return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="9" height="9" rx="2.5" fill="#3b82f6" opacity="0.9"/><rect x="13" y="2" width="9" height="9" rx="2.5" fill="#8b5cf6" opacity="0.65"/><rect x="2" y="13" width="9" height="9" rx="2.5" fill="#8b5cf6" opacity="0.65"/><rect x="13" y="13" width="9" height="9" rx="2.5" fill="#3b82f6" opacity="0.9"/></svg>`;
    }

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2800);
    }

    function renderSkills(skills, catOrder){
      allSkills = skills || [];
      catOrderList = catOrder || [];
      countNum.textContent = allSkills.length;
      applyFilter();
    }

    function applyFilter(){
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q ? allSkills.filter(s =>
        (s.name||'').toLowerCase().includes(q) ||
        (s.description||'').toLowerCase().includes(q)
      ) : allSkills;

      if(filtered.length === 0){
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="9" rx="2.5"/><rect x="2" y="13" width="9" height="9" rx="2.5"/><rect x="13" y="13" width="9" height="9" rx="2.5"/></svg>
          <p>${q ? '没有匹配的 Skill' : '暂无已安装的 Skill'}</p>
          <div class="hint">${q ? '试试其他关键词' : '在上方输入 Git URL 安装新 Skill'}</div>
        </div>`;
        return;
      }

      // 按 category 分组渲染：cat_order 定义顺序优先，其余按出现顺序追加
      const groups = {};
      const order = [...catOrderList];
      filtered.forEach(s => {
        const c = s.category || '其他';
        if(!groups[c]) groups[c] = [];
        groups[c].push(s);
        if(!order.includes(c)) order.push(c);
      });

      grid.innerHTML = order.filter(c => groups[c] && groups[c].length).map(c => {
        const cards = groups[c].map(s => {
          const hasScript = s.has_scripts;
          return `<div class="skill-card">
            <div class="sc-top">
              <div class="sc-icon">${skillIconSvg()}</div>
              <div class="sc-info">
                <div class="sc-name">${esc(s.name)}
                  <span class="sc-badge ${hasScript ? 'has-script' : ''}">${hasScript ? '⚡ 有脚本' : '📄 文档'}</span>
                </div>
                <div class="sc-desc">${esc(s.description || '暂无描述')}</div>
              </div>
            </div>
            <div class="sc-meta">${esc(s.path || s.root || '')}</div>
            <div class="sc-actions">
              <button class="sc-uninstall" data-name="${esc(s.name)}">卸载</button>
            </div>
          </div>`;
        }).join('');
        return `<div class="cat-section">
          <div class="cat-header">
            <span class="cat-title">${esc(c)}</span>
            <span class="cat-count">${groups[c].length}</span>
            <span class="cat-line"></span>
          </div>
          <div class="skill-grid">${cards}</div>
        </div>`;
      }).join('');
    }

    async function loadSkills(){
      grid.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const r = await fetch('/api/skills');
        const d = await r.json();
        renderSkills(d.skills, d.cat_order);
      } catch(e){
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>加载失败: ${esc(e.message)}</p></div>`;
      }
    }

    async function installSkill(){
      const url = document.getElementById('skillGitUrl').value.trim();
      const name = document.getElementById('skillName').value.trim();
      if(!url){ toast('请输入 Git 仓库 URL'); return; }
      if(!name){ toast('请输入 skill 名称'); return; }
      const btn = document.getElementById('skillInstallBtn');
      btn.disabled = true; btn.textContent = '安装中…';
      try {
        const r = await fetch('/api/skills/install', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ url, name })
        });
        const d = await r.json();
        if(d.success){
          toast('✅ 安装成功: ' + name);
          document.getElementById('skillGitUrl').value = '';
          document.getElementById('skillName').value = '';
          loadSkills();
        } else {
          toast('❌ ' + (d.error || '安装失败'));
        }
      } catch(e){
        toast('❌ 网络错误: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = '安装';
      }
    }

    function confirmUninstall(name){
      pendingUninstall = name;
      confirmText.innerHTML = `确定要卸载 Skill <b>${esc(name)}</b> 吗？<br>该操作会删除对应的 skill 目录，不可恢复。`;
      confirmOverlay.classList.add('show');
    }

    async function doUninstall(name){
      toast('卸载中…');
      try {
        const r = await fetch('/api/skills/uninstall', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name })
        });
        const d = await r.json();
        if(d.success){
          toast('✅ 已卸载: ' + name);
          loadSkills();
        } else {
          toast('❌ ' + (d.error || '卸载失败'));
        }
      } catch(e){
        toast('❌ 网络错误: ' + e.message);
      }
    }

    // 事件绑定
    document.getElementById('skillInstallBtn').addEventListener('click', installSkill);
    searchInput.addEventListener('input', applyFilter);
    grid.addEventListener('click', e => {
      const btn = e.target.closest('.sc-uninstall');
      if(btn) confirmUninstall(btn.dataset.name);
    });
    document.getElementById('skillGitUrl').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('skillName').focus(); });
    document.getElementById('skillName').addEventListener('keydown', e => { if(e.key === 'Enter') installSkill(); });

    // Confirm modal 事件
    document.getElementById('confirmCancel').addEventListener('click', () => {
      confirmOverlay.classList.remove('show');
      pendingUninstall = null;
    });
    document.getElementById('confirmOk').addEventListener('click', () => {
      confirmOverlay.classList.remove('show');
      if(pendingUninstall){ doUninstall(pendingUninstall); pendingUninstall = null; }
    });
    confirmOverlay.addEventListener('click', e => {
      if(e.target === confirmOverlay){ confirmOverlay.classList.remove('show'); pendingUninstall = null; }
    });

    // ===== Plugin Tab =====
    function _esc(s){ s = (s==null?'':String(s)); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function switchTab(tab){
      var skillsActive = (tab === 'skills');
      document.getElementById('tabSkills').classList.toggle('active', skillsActive);
      document.getElementById('tabPlugins').classList.toggle('active', !skillsActive);
      document.getElementById('skillsPane').hidden = !skillsActive;
      document.getElementById('pluginsPane').hidden = skillsActive;
      if(!skillsActive){ loadPlugins(); }
    }

    async function loadPlugins(){
      try{
        var r = await fetch('/api/plugins');
        var d = await r.json();
        renderExtRepos(d.plugin_dirs || []);
        renderExtPlugins(d.external || [], d.external_error || '');
        renderBuiltinPlugins(d.builtin || []);
      }catch(e){
        toast('加载插件失败: ' + e.message);
      }
    }

    function renderExtRepos(dirs){
      var box = document.getElementById('extRepoList');
      if(!dirs.length){ box.innerHTML = '<div class="plg-empty">尚未配置外部 Plugin 仓库</div>'; return; }
      box.innerHTML = dirs.map(function(p){
        return '<div class="plg-dir-item"><span class="pd-path">' + _esc(p) + '</span>' +
          '<button class="plg-dir-remove" onclick="removePluginDir(' + _esc(JSON.stringify(p)) + ')">移除</button></div>';
      }).join('');
    }

    function renderExtPlugins(plugins, err){
      var box = document.getElementById('extPluginList');
      if(err){ box.innerHTML = '<div class="plg-empty error">' + _esc(err) + '</div>'; return; }
      if(!plugins.length){ box.innerHTML = '<div class="plg-empty">未发现外部 Plugin（在上方添加仓库后自动扫描）</div>'; return; }
      box.innerHTML = plugins.map(function(p){
        var counts = [];
        if(p.skills && p.skills.length) counts.push('skills:' + p.skills.length);
        if(p.agents && p.agents.length) counts.push('agents:' + p.agents.length);
        if(p.hooks && p.hooks.length) counts.push('hooks:' + p.hooks.length);
        if(p.mcp && p.mcp.length) counts.push('mcp:' + p.mcp.length);
        return '<div class="plg-card">' +
          '<div class="plg-name">' + _esc(p.name || p.dir || '?') +
            (p.version ? ' <span class="plg-ver">v' + _esc(p.version) + '</span>' : '') +
          '</div>' +
          '<div class="plg-desc">' + _esc(p.description || '（无描述）') + '</div>' +
          (counts.length ? '<div class="plg-meta">' + _esc(counts.join(' · ')) + '</div>' : '') +
        '</div>';
      }).join('');
    }

    function renderBuiltinPlugins(items){
      var box = document.getElementById('builtinPluginList');
      if(!items.length){ box.innerHTML = '<div class="plg-empty">未发现内置插件</div>'; return; }
      box.innerHTML = items.map(function(it){
        var badge = it.enabled ? '<span class="plg-tag">已启用</span>' : '<span class="plg-tag dim">已禁用</span>';
        var errTag = it.error ? '<div class="plg-desc error">' + _esc(it.error) + '</div>' : '';
        return '<div class="plg-card">' +
          '<div class="plg-name">' + _esc(it.name) + ' ' + badge + '</div>' +
          (it.description ? '<div class="plg-desc">' + _esc(it.description) + '</div>' : '') +
          '<div class="plg-meta">file: ' + _esc(it.file) + '</div>' +
          errTag +
        '</div>';
      }).join('');
    }

    async function addPluginDir(){
      var input = document.getElementById('pluginDirInput');
      var path = (input.value || '').trim();
      if(!path){ toast('请输入仓库路径'); return; }
      try{
        var r = await fetch('/api/plugins/dir', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({action:'add', path:path})});
        var d = await r.json();
        if(d.success){ input.value = ''; toast('已添加'); loadPlugins(); }
        else { toast('添加失败: ' + (d.error||'未知错误')); }
      }catch(e){ toast('添加失败: ' + e.message); }
    }

    async function removePluginDir(path){
      try{
        var r = await fetch('/api/plugins/dir', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({action:'remove', path:path})});
        var d = await r.json();
        if(d.success){ toast('已移除'); loadPlugins(); }
        else { toast('移除失败: ' + (d.error||'未知错误')); }
      }catch(e){ toast('移除失败: ' + e.message); }
    }

    // 初始化
    loadSkills();
  </script>
</body>
</html>
